<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werth69 | Investments for a bright future</title>

    <script>
        (function () {
            const saved = localStorage.getItem('werth69-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            const savedView = localStorage.getItem('werth69-view') || 'bubbles';
            document.documentElement.setAttribute('data-view', savedView);
        })();
    </script>

    <style>
        :root,
        [data-theme="light"] {
            --bg-base:      #eef5e3;
            --bg-topbar:    rgba(255, 255, 255, 0.85);
            --bg-card:      #ffffff;
            --bg-card-hover:#f6faee;
            --text:         #0f1a0a;
            --text-muted:   #5f6b52;
            --text-invert:  #ffffff;
            --border:       rgba(95, 191, 0, 0.20);
            --border-soft:  #e6eed7;
            --accent:       #5fbf00;
            --accent-hover: #4fa600;
            --accent-soft:  #e6f7cc;
            --accent-glow:  rgba(124, 255, 0, 0.35);
            --bg-grad-1:  rgba(124, 255, 0, 0.18);
            --bg-grad-2:  rgba(95, 191, 0, 0.10);
            --bg-grad-3:  rgba(80, 160, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-base:      #070b05;
            --bg-topbar:    rgba(19, 24, 19, 0.85);
            --bg-card:      #131813;
            --bg-card-hover:#1a2117;
            --text:         #e8f5dd;
            --text-muted:   #8b9a7a;
            --text-invert:  #0a0e08;
            --border:       rgba(124, 255, 43, 0.15);
            --border-soft:  #1f2a1a;
            --accent:       #a8ff3e;
            --accent-hover: #c0ff6a;
            --accent-soft:  #1e2c10;
            --accent-glow:  rgba(168, 255, 62, 0.55);
            --bg-grad-1:  rgba(124, 255, 43, 0.14);
            --bg-grad-2:  rgba(80, 180, 30, 0.08);
            --bg-grad-3:  rgba(20, 60, 10, 0.20);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, Tahoma, sans-serif;
            color: var(--text);
            transition: background 0.4s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 15% 15%, var(--bg-grad-1) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, var(--bg-grad-2) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, var(--bg-grad-3) 0%, transparent 70%),
                var(--bg-base);
            background-attachment: fixed;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 16px 28px;
            background: var(--bg-topbar);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
        }

        .brand { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            box-shadow: 0 0 20px var(--accent-glow);
            flex-shrink: 0;
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .brand-logo:hover {
            transform: scale(1.06);
            box-shadow: 0 0 28px var(--accent-glow);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }

        .brand-text h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-text h1 span {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand-tagline {
            margin: 3px 0 0;
            font-size: 10.5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .view-switch {
            display: flex;
            background: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px;
            gap: 2px;
        }

        .view-btn {
            padding: 8px 18px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .view-btn:hover { color: var(--text); }

        .view-btn.active {
            background: var(--accent);
            color: var(--text-invert);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .theme-toggle {
            background: var(--accent-soft);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: var(--text-invert);
            transform: rotate(15deg);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .arena {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .arena::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 55%);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        html[data-view="bubbles"] .list-view { display: none; }
        html[data-view="list"]   .bubbles-view { display: none; }

        .bubbles-view {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            padding: 0;
            opacity: 0;
            transition: opacity 0.6s ease, filter 0.25s ease, box-shadow 0.25s ease;
            background: radial-gradient(
                circle at 50% 40%,
                var(--bubble-light) 0%,
                var(--bubble-color) 55%,
                var(--bubble-dark) 100%
            );
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.20),
                0 0 28px var(--bubble-glow),
                0 12px 32px rgba(0, 0, 0, 0.55);
            will-change: transform;
            z-index: 1;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center top, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .bubble-icon {
            width: 52%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        .bubble-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
        }

        .bubble-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .bubble-label {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            padding: 0 6px;
        }

        .bubble:hover {
            filter: brightness(1.15);
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.4),
                inset 0 0 45px rgba(255, 255, 255, 0.35),
                0 0 45px var(--bubble-glow),
                0 14px 42px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .bubble:active { filter: brightness(0.92); }

        .list-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            padding: 32px 40px 60px;
            z-index: 1;
        }

        .list-header {
            max-width: 900px;
            margin: 0 auto 28px;
        }

        .list-header h2 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .list-header h2 span {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .list-header p {
            margin: 0;
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cards {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--card-color);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            box-shadow: inset 2px 0 0 0 rgba(255, 255, 255, 0.06);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 0% 50%, var(--card-glow) 0%, transparent 45%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover {
            transform: translateX(6px);
            background: var(--bg-card-hover);
            border-left-width: 6px;
            box-shadow:
                0 8px 28px var(--card-glow),
                inset 2px 0 0 0 var(--card-color);
        }

        .card:hover::before { opacity: 1; }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                circle at 40% 35%,
                var(--card-light) 0%,
                var(--card-color) 60%,
                var(--card-dark) 100%
            );
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.25),
                0 4px 16px var(--card-glow);
            position: relative;
            z-index: 1;
        }

        .card-icon-inner {
            width: 58%;
            height: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            display: block;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
        }

        .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
        }

        .card-body {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .card-title {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
        }

        .card-desc {
            margin: 0;
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-arrow {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.10);
            color: var(--card-light);
            font-size: 18px;
            font-weight: 800;
            transition: all 0.25s ease;
            position: relative;
            z-index: 1;
            border: 1.5px solid var(--card-light);
            text-shadow: 0 0 6px var(--card-glow);
        }

        .card:hover .card-arrow {
            background: var(--card-color);
            color: #ffffff;
            border-color: var(--card-light);
            transform: translateX(4px) scale(1.1);
            box-shadow:
                0 0 16px var(--card-glow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            padding: 11px 22px;
            background: var(--bg-topbar);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 50;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            animation: hintFade 6s ease-in-out infinite;
        }

        html[data-view="list"] .hint { display: none; }

        @keyframes hintFade {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        @media (max-width: 780px) {
            .topbar { padding: 12px 16px; gap: 8px; flex-wrap: wrap; }
            .brand-logo { width: 42px; height: 42px; }
            .brand-text h1 { font-size: 20px; }
            .brand-tagline { display: none; }
            .view-btn { padding: 6px 12px; font-size: 11.5px; }
            .theme-toggle { width: 40px; height: 40px; font-size: 17px; }
            .bubble-label { font-size: 12px; }
            .list-view { padding: 20px 16px 40px; }
            .list-header h2 { font-size: 22px; }
            .card { padding: 14px 16px; gap: 14px; }
            .card-icon { width: 52px; height: 52px; }
            .card-title { font-size: 15px; }
            .card-desc { font-size: 12.5px; }
            .card-arrow { width: 32px; height: 32px; font-size: 15px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <div class="brand-logo">
                <img src="icons/logo.png" alt="Werth69"
                     onerror="this.style.display='none';this.parentElement.textContent='W69';">
            </div>
            <div class="brand-text">
                <h1>Werth<span>69</span></h1>
                <p class="brand-tagline">Investments for a brighter future</p>
            </div>

        <div class="view-switch">
            <button class="view-btn active" data-view="bubbles">🫧 Плавающие</button>

            <button id="theme-toggle" class="theme-toggle" title="Переключить тему">
                <span class="theme-icon">🌙</span>

        </div>

    <div class="arena" id="arena">

        <div class="bubbles-view" id="bubbles-view"></div>

        <div class="list-view" id="list-view">
            <div class="list-header">
                <h2>Куда <span>перейти</span> дальше?</h2>
                <p>Выберите платформу — от инвестиций и торговли до аналитики и обучающего контента.</p>
            </div>
            <div class="cards" id="cards"></div>
        </div>

        <div class="hint">Наведи — подсветится · Кликни — откроется</div>
    </div>

    <script>
        const PLATFORMS = [
            {

            {

                url: 'https://www.linkedin.com/in/%D0%BA%D0%BE%D0%BD%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%BD-%D1%87%D0%B8%D0%BA%D0%B8%D1%80%D0%BE%D0%B2-b16032189/',

                fallback: `<svg viewBox="0 0 24 24" style="display:none"><path d="M3 21h18v-2H3v2zM5 13h2v5H5v-5zm4-3h2v8H9v-8zm4-3h2v11h-2V7zm4-4h2v15h-2V3z"/></svg>`
            },
        ];

        const BUBBLE_SIZE = 180;

        class Bubble {
            constructor(data, arena) {
                this.data = data;
                this.arena = arena;
                this.size = BUBBLE_SIZE;
                this.x = Math.random() * (arena.clientWidth - this.size - 40) + this.size / 2 + 20;
                this.y = Math.random() * (arena.clientHeight - this.size - 40) + this.size / 2 + 20;
                const speedBase = 0.7;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speedBase;
                this.vy = Math.sin(angle) * speedBase;
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.6 + Math.random() * 0.4;
                this.el = document.createElement('a');
                this.el.className = 'bubble';
                this.el.href = data.url;
                this.el.target = '_blank';
                this.el.rel = 'noopener';
                this.el.style.width = this.size + 'px';
                this.el.style.height = this.size + 'px';
                this.el.style.setProperty('--bubble-color', data.color);
                this.el.style.setProperty('--bubble-light', data.light);
                this.el.style.setProperty('--bubble-dark',  data.dark);
                this.el.style.setProperty('--bubble-glow',  this.hexToRgba(data.color, 0.55));
                this.el.innerHTML = `
                    <div class="bubble-icon">
                        ${data.icon}
                        ${data.fallback}
                    </div>
                    <div class="bubble-label">${data.label}</div>
                `;
                arena.appendChild(this.el);
                requestAnimationFrame(() => { this.el.style.opacity = '1'; });
            }

            hexToRgba(hex, alpha) {
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const n = parseInt(hex, 16);
                const r = (n >> 16) & 0xff;
                const g = (n >> 8) & 0xff;
                const b = n & 0xff;
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            update(dt, width, height) {
                this.x += this.vx;
                this.y += this.vy;
                this.wobblePhase += this.wobbleSpeed * 0.05;
                const wobbleX = Math.sin(this.wobblePhase) * 4;
                const wobbleY = Math.cos(this.wobblePhase * 1.3) * 4;
                const r = this.size / 2;
                const mx = this.x + wobbleX;
                const my = this.y + wobbleY;
                if (mx - r < 0) { this.x = r; this.vx = Math.abs(this.vx); }
                else if (mx + r > width) { this.x = width - r; this.vx = -Math.abs(this.vx); }
                if (my - r < 0) { this.y = r; this.vy = Math.abs(this.vy); }
                else if (my + r > height) { this.y = height - r; this.vy = -Math.abs(this.vy); }
                this.el.style.transform = `translate(${this.x - r + wobbleX}px, ${this.y - r + wobbleY}px)`;
            }
        }

        function hexToRgba(hex, alpha) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const n = parseInt(hex, 16);
            const r = (n >> 16) & 0xff;
            const g = (n >> 8) & 0xff;
            const b = n & 0xff;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function renderCards() {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            PLATFORMS.forEach(data => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = data.url;
                card.target = '_blank';
                card.rel = 'noopener';
                card.style.setProperty('--card-color', data.color);
                card.style.setProperty('--card-light', data.light);
                card.style.setProperty('--card-dark',  data.dark);
                card.style.setProperty('--card-glow',  hexToRgba(data.light, 0.45));
                card.style.setProperty('--card-bg-soft', hexToRgba(data.color, 0.12));
                card.innerHTML = `
                    <div class="card-icon">
                        <div class="card-icon-inner">
                            ${data.icon}
                            ${data.fallback}
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${data.label}</h3>
                        <p class="card-desc">${data.description}</p>
                    </div>
                    <div class="card-arrow">→</div>
                `;
                container.appendChild(card);
            });
        }

        const bubblesView = document.getElementById('bubbles-view');
        const bubbles = [];

        function createBubbles() {
            bubblesView.querySelectorAll('.bubble').forEach(el => el.remove());
            bubbles.length = 0;
            PLATFORMS.forEach(data => bubbles.push(new Bubble(data, bubblesView)));
        }

        function animate() {
            const w = bubblesView.clientWidth;
            const h = bubblesView.clientHeight;
            bubbles.forEach(b => b.update(1, w, h));
            requestAnimationFrame(animate);
        }

        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                document.documentElement.setAttribute('data-view', view);
                localStorage.setItem('werth69-view', view);
                viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view));
                if (view === 'bubbles') {
                    requestAnimationFrame(() => { createBubbles(); });
                }
            });
        });
        const initialView = document.documentElement.getAttribute('data-view') || 'bubbles';
        viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === initialView));

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('.theme-icon');
        function applyThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('werth69-theme', next);
            applyThemeIcon();
        });
        applyThemeIcon();

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const w = bubblesView.clientWidth, h = bubblesView.clientHeight;
                bubbles.forEach(b => {
                    const r = b.size / 2;
                    if (b.x - r < 0) b.x = r;
                    if (b.x + r > w) b.x = w - r;
                    if (b.y - r < 0) b.y = r;
                    if (b.y + r > h) b.y = h - r;
                });
            }, 150);
        });

        requestAnimationFrame(() => {
            createBubbles();
            animate();
            renderCards();
        });
    </script>
</body>
</html>
