<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werth69 | Investments for a brighter future</title>

    <link rel="icon" type="image/png" href="icons/logo.png">
    <link rel="apple-touch-icon" href="icons/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        (function () {
            const savedView = localStorage.getItem('werth69-view') || 'bubbles';
            document.documentElement.setAttribute('data-view', savedView);
        })();
    </script>

    <style>
        :root {
            --bg-base:      #0a1310;
            --bg-card:      #0f1a15;
            --bg-card-hover:#142019;
            --bg-panel:     #0f1a15;
            --text:         #d6e6c8;
            --text-muted:   #6f8a68;
            --text-invert:  #0a1310;
            --border:       rgba(168, 255, 62, 0.12);
            --border-soft:  #1a2a1e;
            --accent:       #a8ff3e;
            --accent-hover: #c0ff6a;
            --accent-soft:  #162a10;
            --accent-glow:  rgba(168, 255, 62, 0.50);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', -apple-system, Tahoma, sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            background-image:
                linear-gradient(180deg,
                    rgba(10, 19, 16, 0.80) 0%,
                    rgba(10, 19, 16, 0.70) 50%,
                    rgba(10, 19, 16, 0.85) 100%),
                url("icons/W_picture.png");
            background-size: cover, cover;
            background-position: center center, center center;
            background-attachment: fixed, fixed;
            background-repeat: no-repeat, no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200vmax;
            height: 200vmax;
            border-radius: 50%;
            background-image:
                radial-gradient(circle, transparent 0%, transparent 14%, rgba(168, 255, 62, 0.08) 14%, transparent 14.15%),
                radial-gradient(circle, transparent 0%, transparent 24%, rgba(168, 255, 62, 0.06) 24%, transparent 24.15%),
                radial-gradient(circle, transparent 0%, transparent 34%, rgba(168, 255, 62, 0.05) 34%, transparent 34.15%),
                radial-gradient(circle, transparent 0%, transparent 44%, rgba(168, 255, 62, 0.04) 44%, transparent 44.15%);
            pointer-events: none;
            z-index: 0;
            animation: bgRingsRotate 120s linear infinite;
        }

        @keyframes bgRingsRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 0%,
                transparent 55%,
                rgba(0, 0, 0, 0.55) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .topbar, .arena {
            position: relative;
            z-index: 1;
        }

        /* ============ ТОПБАР ============ */
        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 28px;
            background-color: rgba(10, 19, 16, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: none;
            border-bottom: 1px solid rgba(168, 255, 62, 0.10);
            z-index: 100;
            flex-shrink: 0;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: topbarSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            isolation: isolate;
        }

        @keyframes topbarSlide {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .topbar::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("icons/header-bg.png");
            background-size: cover;
            background-position: center right;
            z-index: -2;
            animation: bgZoom 30s ease-in-out infinite alternate;
            opacity: 0.35;
        }

        @keyframes bgZoom {
            0%   { transform: scale(1.00); }
            50%  { transform: scale(1.03); }
            100% { transform: scale(1.00); }
        }

        .topbar .topbar-shade {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                rgba(10, 19, 16, 0.85) 0%,
                rgba(10, 19, 16, 0.45) 40%,
                rgba(10, 19, 16, 0.45) 60%,
                rgba(10, 19, 16, 0.85) 100%
            );
        }

        .topbar::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            background-image: linear-gradient(
                115deg,
                transparent 0%,
                transparent 30%,
                rgba(168, 255, 62, 0.35) 45%,
                rgba(220, 255, 180, 0.5) 50%,
                rgba(168, 255, 62, 0.35) 55%,
                transparent 70%,
                transparent 100%
            );
            background-size: 220% 100%;
            background-repeat: no-repeat;
            background-position: -100% 0;
            animation: lightSweep 14s linear infinite;
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0.25;
        }

        .topbar .light-beam {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background-image: linear-gradient(
                115deg,
                transparent 0%,
                transparent 40%,
                rgba(220, 255, 180, 0.3) 48%,
                rgba(168, 255, 62, 0.45) 52%,
                transparent 60%,
                transparent 100%
            );
            background-size: 200% 100%;
            background-position: -100% 0;
            background-repeat: no-repeat;
            mix-blend-mode: screen;
            opacity: 0.20;
            animation: lightSweep 14s linear infinite;
            animation-delay: 7s;
        }

        @keyframes lightSweep {
            0%   { background-position: -100% 0; }
            100% { background-position: 220% 0; }
        }

        .brand,
        .view-switch,
        .topbar-actions {
            position: relative;
            z-index: 4;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            box-shadow: 0 0 24px var(--accent-glow);
            flex-shrink: 0;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-3px); }
        }

        .brand-logo:hover {
            transform: scale(1.08);
            box-shadow: 0 0 36px var(--accent-glow);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-text h1 {
            margin: 0;
            font-family: 'Bungee', sans-serif;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1;
            color: #ffffff;
            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.6),
                0 0 24px rgba(168, 255, 62, 0.35);
            text-transform: uppercase;
        }

        .brand-text h1 span {
            color: var(--accent);
            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.6),
                0 0 20px var(--accent-glow);
        }

        .brand-tagline {
            margin: 5px 0 0;
            font-size: 9.5px;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: #b8c9a8;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .view-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(168, 255, 62, 0.22);
            border-radius: 999px;
            padding: 4px;
            gap: 2px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #b8c9a8;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            white-space: nowrap;
        }

        .view-btn svg {
            width: 17px;
            height: 17px;
            display: block;
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .view-btn:hover svg { transform: scale(1.15); }
        .view-btn:hover { color: #ffffff; }

        .view-btn.active {
            background: rgba(168, 255, 62, 0.15);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* ============ АРЕНА ============ */
        .arena {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        html[data-view="bubbles"] .list-view,
        html[data-view="bubbles"] .crypto-view { display: none; }
        html[data-view="list"]   .bubbles-view,
        html[data-view="list"]   .crypto-view { display: none; }
        html[data-view="crypto"] .bubbles-view,
        html[data-view="crypto"] .list-view { display: none; }

        .bubbles-view, .list-view, .crypto-view {
            animation: viewFadeIn 0.5s ease both;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ ПУЗЫРЬКИ ============ */
        .bubbles-view {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            padding: 0;
            opacity: 0;
            transition: opacity 0.8s ease, filter 0.3s ease, box-shadow 0.3s ease;
            background: radial-gradient(
                circle at 50% 40%,
                var(--bubble-light) 0%,
                var(--bubble-color) 55%,
                var(--bubble-dark) 100%
            );
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.20),
                0 0 28px var(--bubble-glow),
                0 12px 32px rgba(0, 0, 0, 0.55);
            will-change: transform;
            z-index: 1;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center top, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .bubble-icon {
            width: 52%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            margin-bottom: 6px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bubble-icon svg {
            width: 100%; height: 100%;
            fill: #ffffff;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
        }

        .bubble-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .bubble-label {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            padding: 0 6px;
        }

        .bubble:hover {
            filter: brightness(1.10);
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.20),
                0 0 28px var(--bubble-glow),
                0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        /* ============ СПИСОК ============ */
        .list-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            padding: 32px 40px 60px;
            z-index: 1;
        }

        .list-header {
            max-width: 900px;
            margin: 0 auto 28px;
        }

        .list-header h2 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .list-header h2 span {
            color: var(--accent);
        }

        .list-header p {
            margin: 0;
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cards {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 22px;
            background: rgba(15, 26, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--card-color);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }

        .card-pattern {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.10;
            z-index: 0;
            background-repeat: repeat;
            background-size: 90px 90px;
            mix-blend-mode: screen;
        }

        .card:hover {
            transform: translateX(6px);
            background: rgba(20, 32, 25, 0.95);
            border-left-width: 6px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                circle at 40% 35%,
                var(--card-light) 0%,
                var(--card-color) 60%,
                var(--card-dark) 100%
            );
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15), 0 4px 16px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .card-icon-inner {
            width: 58%;
            height: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg { width: 100%; height: 100%; fill: #ffffff; display: block; }
        .card-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .card-body {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        .card-title {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
        }

        .card-desc {
            margin: 0;
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-arrow {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            color: var(--card-light);
            font-size: 18px;
            font-weight: 800;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
            border: 1.5px solid var(--card-light);
        }

        .card:hover .card-arrow {
            background: var(--card-color);
            color: #ffffff;
            transform: translateX(6px) scale(1.12);
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            padding: 11px 22px;
            background: rgba(15, 26, 21, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            z-index: 50;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            animation: hintFloat 5s ease-in-out infinite;
        }

        @keyframes hintFloat {
            0%, 100% { opacity: 0.75; transform: translateX(-50%) translateY(0); }
            50%      { opacity: 1;    transform: translateX(-50%) translateY(-3px); }
        }

        html[data-view="list"] .hint,
        html[data-view="crypto"] .hint { display: none; }

        /* ============================================================
           КРИПТОКОНЦЕПЦИИ
           ============================================================ */
        .crypto-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            padding: 20px 0 60px;
        }

        .crypto-stage {
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            height: 1100px;
        }

        /* Декоративные кольца */
        .crypto-stage::before,
        .crypto-stage::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(168, 255, 62, 0.10);
            pointer-events: none;
            z-index: 1;
        }

        .crypto-stage::before {
            width: 950px;
            height: 950px;
            animation: ringPulse 6s ease-in-out infinite;
        }

        .crypto-stage::after {
            width: 680px;
            height: 680px;
            border-color: rgba(168, 255, 62, 0.07);
            animation: ringPulse 6s ease-in-out infinite;
            animation-delay: 3s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.6; }
            50%      { transform: translate(-50%, -50%) scale(1.03); opacity: 1; }
        }

        /* Лучи от Bitcoin к карточкам */
        .crypto-rays {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .crypto-rays svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .crypto-rays line {
            stroke: rgba(168, 255, 62, 0.35);
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 6 4;
            filter: drop-shadow(0 0 4px rgba(168, 255, 62, 0.6));
            animation: rayDash 20s linear infinite;
        }

        @keyframes rayDash {
            to { stroke-dashoffset: -200; }
        }

        .crypto-rays circle {
            fill: rgba(168, 255, 62, 0.9);
            filter: drop-shadow(0 0 6px rgba(168, 255, 62, 0.9));
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { r: 3; opacity: 0.8; }
            50%      { r: 4.5; opacity: 1; }
        }

        /* ========== Центр: Bitcoin + орбита ========== */
        .crypto-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Свечение под Bitcoin */
        .crypto-center-glow {
            position: absolute;
            inset: -35%;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(247, 147, 26, 0.40) 0%,
                rgba(247, 147, 26, 0.12) 45%,
                transparent 70%);
        }

        @keyframes cryptoPulse {
            0%, 100% { transform: scale(1);    opacity: 0.7; }
            50%      { transform: scale(1.15); opacity: 1;   }
        }

        /* ОРБИТА — картинка b_w.png */
        .crypto-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            animation: orbitSpin 60s linear infinite;
            filter: drop-shadow(0 0 18px rgba(247, 147, 26, 0.55));
            opacity: 0.95;
        }

        @keyframes orbitSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .crypto-orbit img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Второе кольцо — реверс */
        .crypto-orbit-2 {
            display: none;   /* вторая орбита скрыта */
        }

        /* Центральный Bitcoin */
        .crypto-center-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 60px rgba(247, 147, 26, 0.85));
            position: relative;
            z-index: 3;
            /* Bitcoin статичен — без анимаций */
        }

        .crypto-center-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #FFD54D 0%, #F7931A 50%, #B86A00 100%);
            color: #ffffff;
            font-size: 140px;
            font-weight: 900;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 80px rgba(247, 147, 26, 0.7),
                inset 0 0 50px rgba(0, 0, 0, 0.35);
            font-family: 'Georgia', serif;
            position: relative;
            z-index: 3;
        }

        /* ============================================================
           9 карточек — радиус 380px (ближе к Bitcoin)
           ============================================================ */
        .crypto-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 270px;
            height: 190px;
            margin-left: -135px;
            margin-top: -95px;

            --angle: 0deg;
            --radius: 380px;
            --wobble: 0s;

            transform:
                rotate(var(--angle))
                translate(0, calc(-1 * var(--radius)))
                rotate(calc(-1 * var(--angle)));

            transform-origin: 50% 50%;

            background: rgba(15, 26, 21, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(168, 255, 62, 0.18);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.35s ease, border-color 0.35s ease;
            cursor: pointer;
            z-index: 3;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
            opacity: 0;
            animation:
                cryptoCardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both,
                cardWobble 6s ease-in-out infinite;
        }

        @keyframes cryptoCardIn {
            from {
                opacity: 0;
                transform:
                    rotate(var(--angle))
                    translate(0, calc(-1 * var(--radius) - 40px))
                    rotate(calc(-1 * var(--angle)))
                    scale(0.85);
            }
            to {
                opacity: 1;
                transform:
                    rotate(var(--angle))
                    translate(0, calc(-1 * var(--radius)))
                    rotate(calc(-1 * var(--angle)))
                    scale(1);
            }
        }

        @keyframes cardWobble {
            0%, 100% {
                transform:
                    rotate(var(--angle))
                    translate(0, calc(-1 * var(--radius)))
                    rotate(calc(-1 * var(--angle)))
                    translate(0, 0);
            }
            50% {
                transform:
                    rotate(var(--angle))
                    translate(0, calc(-1 * var(--radius)))
                    rotate(calc(-1 * var(--angle)))
                    translate(0, -5px);
            }
        }

        .crypto-card:hover {
            border-color: var(--accent);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.75),
                0 0 40px var(--accent-glow);
            z-index: 20;
            animation-play-state: paused;
        }

        .crypto-card-1 { --angle: 0deg;   animation-delay: 0.05s, 0s;   }
        .crypto-card-2 { --angle: 40deg;  animation-delay: 0.10s, 0.5s; }
        .crypto-card-3 { --angle: 80deg;  animation-delay: 0.15s, 1s;   }
        .crypto-card-4 { --angle: 120deg; animation-delay: 0.20s, 1.5s; }
        .crypto-card-5 { --angle: 160deg; animation-delay: 0.25s, 2s;   }
        .crypto-card-6 { --angle: 200deg; animation-delay: 0.30s, 2.5s; }
        .crypto-card-7 { --angle: 240deg; animation-delay: 0.35s, 3s;   }
        .crypto-card-8 { --angle: 280deg; animation-delay: 0.40s, 3.5s; }
        .crypto-card-9 { --angle: 320deg; animation-delay: 0.45s, 4s;   }

        .crypto-card-image {
            height: 110px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .crypto-card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
            pointer-events: none;
        }

        .crypto-card-glass-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;

            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.35),
                inset 0 -1px 1px rgba(0, 0, 0, 0.20),
                0 8px 24px rgba(0, 0, 0, 0.35);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1);    }
            50%      { transform: translate(-50%, -50%) scale(1.08); }
        }

        .crypto-card-glass-icon::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 40%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.7) 0%, transparent 70%);
            pointer-events: none;
        }

        .crypto-card-glass-icon svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
        }

        .crypto-card-body {
            padding: 14px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow: hidden;
        }

        .crypto-card-body h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
        }

        .crypto-card-body p {
            margin: 0;
            font-size: 12px;
            color: #b8c9a8;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ============================================================
           АКТУАЛЬНЫЕ АКТИВЫ
           ============================================================ */
        .crypto-assets {
            max-width: 1300px;
            margin: 20px auto 0;
            padding: 0 40px;
        }

        .crypto-assets h2 {
            margin: 0 0 20px;
            font-size: 26px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.4px;
        }

        .crypto-assets-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        .crypto-asset-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: rgba(15, 26, 21, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .crypto-asset-card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 24px var(--accent-glow);
            transform: translateY(-3px);
        }

        .crypto-asset-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .crypto-asset-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            flex-shrink: 0;
            border: 1px solid;
        }

        .crypto-asset-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .crypto-asset-info strong {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
        }

        .crypto-asset-price {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .crypto-asset-sparkline {
            width: 100%;
            height: 36px;
        }

        .crypto-asset-sparkline svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .crypto-asset-change {
            font-size: 13px;
            font-weight: 800;
        }

        .crypto-asset-change.up { color: #16a34a; }
        .crypto-asset-change.down { color: #dc2626; }

        /* ============================================================
           МОДАЛЬНОЕ ОКНО
           ============================================================ */
        .post-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .post-modal.hidden { display: none; }

        .post-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .post-modal-dialog {
            position: relative;
            width: 100%;
            max-width: 880px;
            background: rgba(15, 26, 21, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            animation: postDialogIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
            margin: auto;
        }

        @keyframes postDialogIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .post-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 5;
        }

        .post-modal-close:hover {
            background: var(--accent);
            color: var(--text-invert);
            border-color: var(--accent);
            transform: rotate(90deg);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .post-modal-hero {
            width: 100%;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .post-modal-hero img {
            max-width: 100%;
            max-height: 420px;
            width: auto;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .post-modal-body {
            padding: 28px 36px 36px;
        }

        .post-modal-title {
            margin: 0 0 20px;
            font-size: 28px;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: -0.4px;
            color: var(--text);
        }

        .post-modal-text {
            font-size: 15px;
            line-height: 1.75;
            color: var(--text);
        }

        .post-modal-text p {
            margin: 0 0 16px;
        }

        .post-modal-text p:last-child {
            margin-bottom: 0;
        }

        .post-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 20px 36px 28px;
            border-top: 1px solid var(--border-soft);
        }

        .post-modal-footer .btn {
            padding: 12px 26px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .post-modal-footer .btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ============ АДАПТИВ ============ */
        @media (max-width: 1500px) {
            .crypto-card {
                --radius: 350px;
                width: 240px;
                height: 180px;
                margin-left: -120px;
                margin-top: -90px;
            }
            .crypto-orbit    { width: 700px; height: 700px; }
            .crypto-orbit-2  { width: 900px; height: 900px; }
        }

        @media (max-width: 1300px) {
            .crypto-card {
                --radius: 320px;
                width: 220px;
                height: 170px;
                margin-left: -110px;
                margin-top: -85px;
            }
            .crypto-card-body h3 { font-size: 14px; }
            .crypto-card-body p { font-size: 11px; }
            .crypto-orbit    { width: 620px; height: 620px; }
            .crypto-orbit-2  { width: 800px; height: 800px; }
        }

        @media (max-width: 1100px) {
            .crypto-card {
                --radius: 280px;
                width: 200px;
                height: 160px;
                margin-left: -100px;
                margin-top: -80px;
            }
            .crypto-orbit    { width: 540px; height: 540px; }
            .crypto-orbit-2  { width: 700px; height: 700px; }
        }

        @media (max-width: 1000px) {
            .crypto-stage {
                height: auto;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
                padding: 20px;
            }
            .crypto-rays,
            .crypto-stage::before,
            .crypto-stage::after,
            .crypto-orbit,
            .crypto-orbit-2 { display: none; }
            .crypto-center {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                grid-column: 1 / -1;
                margin: 20px auto;
                width: 180px;
                height: 180px;
            }
            .crypto-card {
                position: relative;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                margin: 0 !important;
                width: 100%;
                height: auto;
                opacity: 1;
                animation: none;
            }
            .crypto-card:hover {
                transform: translateY(-5px) scale(1.02) !important;
            }
            .crypto-assets-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 780px) {
            .topbar { padding: 12px 16px; gap: 8px; flex-wrap: wrap; }
            .brand-logo { width: 44px; height: 44px; }
            .brand-text h1 { font-size: 22px; letter-spacing: 0.5px; }

            .card-desc { font-size: 12.5px; }

            .crypto-stage {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .crypto-assets { padding: 0 16px; margin-top: 30px; }
            .crypto-assets-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .post-modal { padding: 16px 12px; }
            .post-modal-hero { padding: 12px; }
            .post-modal-hero img { max-height: 260px; }
            .post-modal-body { padding: 20px 22px 26px; }
            .post-modal-title { font-size: 22px; }
            .post-modal-text { font-size: 14px; }
            .post-modal-footer { padding: 16px 22px 22px; }
        }

        @media (max-width: 480px) {
            .crypto-assets-list { grid-template-columns: 1fr; }
        }
    </style>
</head>

        ];

        const BUBBLE_SIZE = 180;
        const CARD_RADIUS = 380;

        class Bubble {
            constructor(data, arena) {
                this.data = data;
                this.arena = arena;
                this.size = BUBBLE_SIZE;
                this.x = Math.random() * (arena.clientWidth - this.size - 40) + this.size / 2 + 20;
                this.y = Math.random() * (arena.clientHeight - this.size - 40) + this.size / 2 + 20;
                const speedBase = 0.7;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speedBase;
                this.vy = Math.sin(angle) * speedBase;
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.6 + Math.random() * 0.4;
                this.el = document.createElement('a');
                this.el.className = 'bubble';
                this.el.href = data.url;
                this.el.target = '_blank';
                this.el.rel = 'noopener';
                this.el.style.width = this.size + 'px';
                this.el.style.height = this.size + 'px';
                this.el.style.setProperty('--bubble-color', data.color);
                this.el.style.setProperty('--bubble-light', data.light);
                this.el.style.setProperty('--bubble-dark',  data.dark);
                this.el.style.setProperty('--bubble-glow',  this.hexToRgba(data.color, 0.55));
                this.el.innerHTML = `
                    <div class="bubble-icon">
                        ${data.icon}
                        ${data.fallback}
                    </div>
                    <div class="bubble-label">${data.label}</div>
                `;
                arena.appendChild(this.el);
                setTimeout(() => { this.el.style.opacity = '1'; }, Math.random() * 400);
            }

            hexToRgba(hex, alpha) {
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const n = parseInt(hex, 16);
                const r = (n >> 16) & 0xff;
                const g = (n >> 8) & 0xff;
                const b = n & 0xff;
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            update(dt, width, height) {
                this.x += this.vx;
                this.y += this.vy;
                this.wobblePhase += this.wobbleSpeed * 0.05;
                const wobbleX = Math.sin(this.wobblePhase) * 4;
                const wobbleY = Math.cos(this.wobblePhase * 1.3) * 4;
                const r = this.size / 2;
                const mx = this.x + wobbleX;
                const my = this.y + wobbleY;
                if (mx - r < 0) { this.x = r; this.vx = Math.abs(this.vx); }
                else if (mx + r > width) { this.x = width - r; this.vx = -Math.abs(this.vx); }
                if (my - r < 0) { this.y = r; this.vy = Math.abs(this.vy); }
                else if (my + r > height) { this.y = height - r; this.vy = -Math.abs(this.vy); }
                this.el.style.transform = `translate(${this.x - r + wobbleX}px, ${this.y - r + wobbleY}px)`;
            }
        }

        function buildPatternDataUrl(svg, color) {
            const size = 90;
            const iconSize = 26;
            const offset = (size - iconSize) / 2;
            const wrapped = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}">
                    <g transform="translate(${offset}, ${offset})" fill="${color}" opacity="0.65">
                        <g transform="scale(${iconSize / 24})">
                            ${svg.replace(/<svg[^>]*>|<\/svg>/g, '')}
                        </g>
                    </g>
                </svg>
            `;
            return `url("data:image/svg+xml;charset=UTF-8,${encodeURIComponent(wrapped)}")`;
        }

        function renderCards() {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            PLATFORMS.forEach(data => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = data.url;
                card.target = '_blank';
                card.rel = 'noopener';
                card.style.setProperty('--card-color', data.color);
                card.style.setProperty('--card-light', data.light);
                card.style.setProperty('--card-dark',  data.dark);
                card.innerHTML = `
                    <div class="card-pattern" style="background-image: ${buildPatternDataUrl(data.pattern, data.color)};"></div>
                    <div class="card-icon">
                        <div class="card-icon-inner">
                            ${data.icon}
                            ${data.fallback}
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${data.label}</h3>
                        <p class="card-desc">${data.description}</p>
                    </div>
                    <div class="card-arrow">→</div>
                `;
                container.appendChild(card);
            });
        }

        function renderCryptoView() {
            const container = document.getElementById('crypto-view');
            if (!container || container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            const cardsHTML = CRYPTO_POSTS.map((p, i) => `
                <a href="#" class="crypto-card crypto-card-${i + 1}" onclick="event.preventDefault(); openPostModal(${i});">
                    <div class="crypto-card-image"
                         style="background-image: url('${p.image}'); background-color: ${p.color};">
                        <div class="crypto-card-glass-icon">
                            ${p.icon}
                        </div>
                    </div>
                    <div class="crypto-card-body">
                        <h3>${p.title}</h3>
                        <p>${p.excerpt}</p>
                    </div>
                </a>
            `).join('');

            const assetsHTML = ASSETS.map(a => `
                <div class="crypto-asset-card">
                    <div class="crypto-asset-head">
                        <div class="crypto-asset-icon" style="background: ${a.color}25; color: ${a.color}; border-color: ${a.color}50;">
                            ${a.icon}
                        </div>
                        <div class="crypto-asset-info">
                            <strong>${a.name}</strong>
                            <span class="crypto-asset-price">$ ${a.price.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="crypto-asset-sparkline">
                        ${a.change >= 0
                            ? `<svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline points="0,22 15,20 30,23 45,17 60,18 75,12 90,13 100,10"
                                          fill="none" stroke="#16a34a" stroke-width="1.8"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                              </svg>`
                            : `<svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline points="0,10 15,12 30,9 45,14 60,13 75,17 90,18 100,20"
                                          fill="none" stroke="#dc2626" stroke-width="1.8"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                              </svg>`
                        }
                    </div>
                    <span class="crypto-asset-change ${a.change >= 0 ? 'up' : 'down'}">
                        ${a.change >= 0 ? '+' : ''}${a.change.toFixed(2)}%
                    </span>
                </div>
            `).join('');

            const cx = 750, cy = 550;
            const raysHTML = CRYPTO_POSTS.map((p, i) => {
                const angleDeg = i * 40 - 90;
                const angleRad = angleDeg * Math.PI / 180;
                const startR = 150;
                const endR = CARD_RADIUS - 20;
                const x1 = cx + Math.cos(angleRad) * startR;
                const y1 = cy + Math.sin(angleRad) * startR;
                const x2 = cx + Math.cos(angleRad) * endR;
                const y2 = cy + Math.sin(angleRad) * endR;
                return `
                    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />
                    <circle cx="${x2}" cy="${y2}" r="3" />
                `;
            }).join('');

                        container.innerHTML = `
                <div class="crypto-stage">
                    <div class="crypto-rays">
                        <svg viewBox="0 0 1500 1100" preserveAspectRatio="xMidYMid meet">
                            ${raysHTML}
                        </svg>
                    </div>

                    <div class="crypto-center">
                        <div class="crypto-center-glow"></div>

                        <div class="crypto-orbit">
                            <img src="icons/b_w.png" alt="" onerror="this.style.display='none';">
                        </div>
                    </div>
                    ${cardsHTML}
                </div>
                <div class="crypto-assets">
                    <h2>Актуальные активы</h2>
                    <div class="crypto-assets-list">
                        ${assetsHTML}
                    </div>
                </div>
            `;
        }

        const postModal = document.getElementById('post-modal');
        const postModalImage = document.getElementById('post-modal-image');
        const postModalTitle = document.getElementById('post-modal-title');
        const postModalText = document.getElementById('post-modal-text');

        function openPostModal(index) {
            const post = CRYPTO_POSTS[index];
            if (!post) return;

            postModalImage.src = post.image;
            postModalImage.alt = post.title;
            postModalTitle.textContent = post.title;

            const paragraphs = (post.fullText || post.excerpt)
                .split('\n\n')
                .map(p => p.trim())
                .filter(p => p.length > 0);

            postModalText.innerHTML = paragraphs
                .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                .join('');

            postModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePostModal() {
            postModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !postModal.classList.contains('hidden')) {
                closePostModal();
            }
        });

        const bubblesView = document.getElementById('bubbles-view');
        const bubbles = [];

        function createBubbles() {
            bubblesView.querySelectorAll('.bubble').forEach(el => el.remove());
            bubbles.length = 0;
            PLATFORMS.forEach(data => bubbles.push(new Bubble(data, bubblesView)));
        }

        function animate() {
            const w = bubblesView.clientWidth;
            const h = bubblesView.clientHeight;
            bubbles.forEach(b => b.update(1, w, h));
            requestAnimationFrame(animate);
        }

        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                document.documentElement.setAttribute('data-view', view);
                localStorage.setItem('werth69-view', view);
                viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view));
                if (view === 'bubbles') {
                    requestAnimationFrame(() => createBubbles());
                }
                if (view === 'crypto') {
                    renderCryptoView();
                }
            });
        });

        const initialView = document.documentElement.getAttribute('data-view') || 'bubbles';
        viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === initialView));

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const w = bubblesView.clientWidth, h = bubblesView.clientHeight;
                bubbles.forEach(b => {
                    const r = b.size / 2;
                    if (b.x - r < 0) b.x = r;
                    if (b.x + r > w) b.x = w - r;
                    if (b.y - r < 0) b.y = r;
                    if (b.y + r > h) b.y = h - r;
                });
            }, 150);
        });

        requestAnimationFrame(() => {
            createBubbles();
            animate();
            renderCards();
            if (initialView === 'crypto') {
                renderCryptoView();
            }
        });
    </script>
</body>
</html>
