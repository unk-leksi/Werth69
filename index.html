<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werth69 | Investments for a brighter future</title>

    <link rel="icon" type="image/png" href="icons/logo.png">
    <link rel="apple-touch-icon" href="icons/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Bungee+Inline&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        (function () {
            const savedView = localStorage.getItem('werth69-view') || 'bubbles';
            document.documentElement.setAttribute('data-view', savedView);
        })();
    </script>

    <style>
        :root {
            --bg-base:      #0a1310;
            --bg-card:      #0f1a15;
            --bg-card-hover:#142019;
            --bg-panel:     #0f1a15;
            --text:         #d6e6c8;
            --text-muted:   #6f8a68;
            --text-invert:  #0a1310;
            --border:       rgba(168, 255, 62, 0.12);
            --border-soft:  #1a2a1e;
            --accent:       #a8ff3e;
            --accent-hover: #c0ff6a;
            --accent-soft:  #162a10;
            --accent-glow:  rgba(168, 255, 62, 0.50);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', -apple-system, Tahoma, sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            background-image:
                linear-gradient(180deg,
                    rgba(10, 19, 16, 0.80) 0%,
                    rgba(10, 19, 16, 0.70) 50%,
                    rgba(10, 19, 16, 0.85) 100%),
                url("icons/W_picture.png");
            background-size: cover, cover;
            background-position: center center, center center;
            background-attachment: fixed, fixed;
            background-repeat: no-repeat, no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200vmax;
            height: 200vmax;
            border-radius: 50%;
            background-image:
                radial-gradient(circle, transparent 0%, transparent 14%, rgba(168, 255, 62, 0.08) 14%, transparent 14.15%),
                radial-gradient(circle, transparent 0%, transparent 24%, rgba(168, 255, 62, 0.06) 24%, transparent 24.15%),
                radial-gradient(circle, transparent 0%, transparent 34%, rgba(168, 255, 62, 0.05) 34%, transparent 34.15%),
                radial-gradient(circle, transparent 0%, transparent 44%, rgba(168, 255, 62, 0.04) 44%, transparent 44.15%);
            pointer-events: none;
            z-index: 0;
            animation: bgRingsRotate 120s linear infinite;
        }

        @keyframes bgRingsRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 0%,
                transparent 55%,
                rgba(0, 0, 0, 0.55) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .topbar, .arena {
            position: relative;
            z-index: 1;
        }

        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 28px;
            background-color: rgba(10, 19, 16, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: none;
            border-bottom: 1px solid rgba(168, 255, 62, 0.10);
            z-index: 100;
            flex-shrink: 0;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: topbarSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            isolation: isolate;
        }

        @keyframes topbarSlide {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .topbar::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("icons/header-bg.png");
            background-size: cover;
            background-position: center right;
            z-index: -2;
            animation: bgZoom 30s ease-in-out infinite alternate;
            opacity: 0.35;
        }

        @keyframes bgZoom {
            0%   { transform: scale(1.00); }
            50%  { transform: scale(1.03); }
            100% { transform: scale(1.00); }
        }

        .topbar .topbar-shade {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                rgba(10, 19, 16, 0.85) 0%,
                rgba(10, 19, 16, 0.45) 40%,
                rgba(10, 19, 16, 0.45) 60%,
                rgba(10, 19, 16, 0.85) 100%
            );
        }

        .topbar::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            background-image: linear-gradient(
                115deg,
                transparent 0%,
                transparent 30%,
                rgba(168, 255, 62, 0.35) 45%,
                rgba(220, 255, 180, 0.5) 50%,
                rgba(168, 255, 62, 0.35) 55%,
                transparent 70%,
                transparent 100%
            );
            background-size: 220% 100%;
            background-repeat: no-repeat;
            background-position: -100% 0;
            animation: lightSweep 14s linear infinite;
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0.25;
        }

        .topbar .light-beam {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background-image: linear-gradient(
                115deg,
                transparent 0%,
                transparent 40%,
                rgba(220, 255, 180, 0.3) 48%,
                rgba(168, 255, 62, 0.45) 52%,
                transparent 60%,
                transparent 100%
            );
            background-size: 200% 100%;
            background-position: -100% 0;
            background-repeat: no-repeat;
            mix-blend-mode: screen;
            opacity: 0.20;
            animation: lightSweep 14s linear infinite;
            animation-delay: 7s;
        }

        @keyframes lightSweep {
            0%   { background-position: -100% 0; }
            100% { background-position: 220% 0; }
        }

        .brand,
        .view-switch,
        .topbar-actions {
            position: relative;
            z-index: 4;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        /* Логотип: без салатового фона, только крутящееся видео */
        .brand-logo {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: none;
            flex-shrink: 0;
            transition: transform 0.25s ease;
            position: relative;
        }

        .brand-logo:hover {
            transform: scale(1.06);
        }

        .brand-logo video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-text h1 {
            margin: 0;
            font-family: 'Bungee', sans-serif;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1;
            color: #ffffff;
            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.6),
                0 0 24px rgba(168, 255, 62, 0.35);
            text-transform: uppercase;
        }

        .brand-text h1 span {
            color: var(--accent);
            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.6),
                0 0 20px var(--accent-glow);
        }

        .brand-tagline {
            margin: 5px 0 0;
            font-size: 9.5px;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: #b8c9a8;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .view-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(168, 255, 62, 0.22);
            border-radius: 999px;
            padding: 4px;
            gap: 2px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #b8c9a8;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            white-space: nowrap;
        }

        .view-btn svg {
            width: 17px;
            height: 17px;
            display: block;
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .view-btn:hover svg { transform: scale(1.15); }
        .view-btn:hover { color: #ffffff; }

        .view-btn.active {
            background: rgba(168, 255, 62, 0.15);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .arena {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        html[data-view="bubbles"] .list-view,
        html[data-view="bubbles"] .crypto-view,
        html[data-view="bubbles"] .mypath-view { display: none; }

        html[data-view="list"] .bubbles-view,
        html[data-view="list"] .crypto-view,
        html[data-view="list"] .mypath-view { display: none; }

        html[data-view="crypto"] .bubbles-view,
        html[data-view="crypto"] .list-view,
        html[data-view="crypto"] .mypath-view { display: none; }

        html[data-view="mypath"] .bubbles-view,
        html[data-view="mypath"] .list-view,
        html[data-view="mypath"] .crypto-view { display: none; }

        .bubbles-view, .list-view, .crypto-view, .mypath-view {
            animation: viewFadeIn 0.5s ease both;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .bubbles-view {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            padding: 0;
            opacity: 0;
            transition: opacity 0.8s ease, filter 0.3s ease, box-shadow 0.3s ease;
            background: radial-gradient(
                circle at 50% 40%,
                var(--bubble-light) 0%,
                var(--bubble-color) 55%,
                var(--bubble-dark) 100%
            );
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.20),
                0 0 28px var(--bubble-glow),
                0 12px 32px rgba(0, 0, 0, 0.55);
            will-change: transform;
            z-index: 1;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center top, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .bubble-icon {
            width: 52%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            margin-bottom: 6px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bubble-icon svg {
            width: 100%; height: 100%;
            fill: #ffffff;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
        }

        .bubble-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .bubble-label {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            padding: 0 6px;
        }

        .bubble:hover {
            filter: brightness(1.10);
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.20),
                0 0 28px var(--bubble-glow),
                0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .list-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            padding: 32px 40px 60px;
            z-index: 1;
        }

        .list-header {
            max-width: 900px;
            margin: 0 auto 28px;
        }

        .list-header h2 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .list-header h2 span {
            color: var(--accent);
        }

        .list-header p {
            margin: 0;
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cards {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 22px;
            background: rgba(15, 26, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--card-color);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }

        .card-pattern {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.10;
            z-index: 0;
            background-repeat: repeat;
            background-size: 90px 90px;
            mix-blend-mode: screen;
        }

        .card:hover {
            transform: translateX(6px);
            background: rgba(20, 32, 25, 0.95);
            border-left-width: 6px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                circle at 40% 35%,
                var(--card-light) 0%,
                var(--card-color) 60%,
                var(--card-dark) 100%
            );
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15), 0 4px 16px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .card-icon-inner {
            width: 58%;
            height: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg { width: 100%; height: 100%; fill: #ffffff; display: block; }
        .card-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .card-body {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        .card-title {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
        }

        .card-desc {
            margin: 0;
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-arrow {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            color: var(--card-light);
            font-size: 18px;
            font-weight: 800;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
            border: 1.5px solid var(--card-light);
        }

        .card:hover .card-arrow {
            background: var(--card-color);
            color: #ffffff;
            transform: translateX(6px) scale(1.12);
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            padding: 11px 22px;
            background: rgba(15, 26, 21, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            z-index: 50;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            animation: hintFloat 5s ease-in-out infinite;
        }

        @keyframes hintFloat {
            0%, 100% { opacity: 0.75; transform: translateX(-50%) translateY(0); }
            50%      { opacity: 1;    transform: translateX(-50%) translateY(-3px); }
        }

        html[data-view="list"] .hint,
        html[data-view="crypto"] .hint,
        html[data-view="mypath"] .hint { display: none; }

        .crypto-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            padding: 20px 0 60px;
        }

        .crypto-stage {
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            height: 1100px;
        }

        .crypto-stage::before,
        .crypto-stage::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(168, 255, 62, 0.10);
            pointer-events: none;
            z-index: 1;
        }

        .crypto-stage::before {
            width: 950px;
            height: 950px;
            animation: ringPulse 6s ease-in-out infinite;
        }

        .crypto-stage::after {
            width: 680px;
            height: 680px;
            border-color: rgba(168, 255, 62, 0.07);
            animation: ringPulse 6s ease-in-out infinite;
            animation-delay: 3s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.6; }
            50%      { transform: translate(-50%, -50%) scale(1.03); opacity: 1; }
        }

        .crypto-rays {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .crypto-rays svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .crypto-rays line {
            stroke: rgba(168, 255, 62, 0.35);
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 6 4;
            filter: drop-shadow(0 0 4px rgba(168, 255, 62, 0.6));
            animation: rayDash 20s linear infinite;
        }

        @keyframes rayDash {
            to { stroke-dashoffset: -200; }
        }

        .crypto-rays circle {
            fill: rgba(168, 255, 62, 0.9);
            filter: drop-shadow(0 0 6px rgba(168, 255, 62, 0.9));
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { r: 3; opacity: 0.8; }
            50%      { r: 4.5; opacity: 1; }
        }

        .crypto-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .crypto-center-glow {
            position: absolute;
            inset: -25%;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(39, 235, 210, 0.34) 0%,
                rgba(39, 235, 210, 0.12) 45%,
                transparent 70%);
            z-index: 1;
            animation: turquoiseGlow 3.5s ease-in-out infinite;
        }

        @keyframes turquoiseGlow {
            0%, 100% { transform: scale(0.94); opacity: 0.72; }
            50%      { transform: scale(1.08); opacity: 1; }
        }

        .crypto-rotor {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 380px;
            height: 380px;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: rotorSpin 24s linear infinite;
        }

        .crypto-rotor svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        @keyframes rotorSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .crypto-coin {
            position: relative;
            width: 180px;
            height: 180px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            filter:
                drop-shadow(0 0 24px rgba(39, 235, 210, 0.80))
                drop-shadow(0 0 60px rgba(39, 235, 210, 0.48));
            transition: filter 0.35s ease, transform 0.35s ease;
        }

        .crypto-coin::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(39, 235, 210, 0.72);
            box-shadow:
                0 0 14px rgba(39, 235, 210, 0.85),
                0 0 34px rgba(39, 235, 210, 0.48),
                inset 0 0 18px rgba(39, 235, 210, 0.20);
            opacity: 0.9;
            animation: coinTurquoiseRing 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes coinTurquoiseRing {
            0%, 100% { transform: scale(0.98); opacity: 0.68; }
            50%      { transform: scale(1.05); opacity: 1; }
        }

        .crypto-coin:hover {
            filter:
                drop-shadow(0 0 32px rgba(39, 235, 210, 0.95))
                drop-shadow(0 0 78px rgba(39, 235, 210, 0.60));
            transform: scale(1.035);
        }

        .crypto-stage.posts-hidden .crypto-card,

        .crypto-card {
            position: absolute;
            top: 50%;
            left: 50%;

            --angle: 0deg;
            --radius: 380px;

                rotate(var(--angle))
                translate(0, calc(-1 * var(--radius)))
                rotate(calc(-1 * var(--angle)));

            transform-origin: 50% 50%;

            background: rgba(15, 26, 21, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(168, 255, 62, 0.18);

            flex-direction: column;

                cryptoCardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both,

                opacity: 0;
                transform: rotate(var(--angle)) translate(0, calc(-1 * var(--radius) - 40px)) rotate(calc(-1 * var(--angle))) scale(0.85);
            }
            to {
                opacity: 1;
                transform: rotate(var(--angle)) translate(0, calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle))) scale(1);
            }
        }

        @keyframes cardWobble {
            0%, 100% {
                transform: rotate(var(--angle)) translate(0, calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle))) translate(0, 0);
            }
            50% {
                transform: rotate(var(--angle)) translate(0, calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle))) translate(0, -5px);
            }

        @keyframes sideFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }

        .side-track {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .side-track-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(168, 255, 62, 0.15) 10%,
                rgba(168, 255, 62, 0.4) 50%,
                rgba(168, 255, 62, 0.15) 90%,
                transparent 100%);
            border-radius: 2px;
            overflow: hidden;
        }

        .side-track-line::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg,
                transparent 0%,
                var(--accent) 50%,
                transparent 100%);
            filter: blur(2px);
            animation: pulseTravelDown 6s ease-in-out infinite;

        @keyframes pulseTravelDown {
            0%   { top: -80px; opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }

        .side-step {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(15, 26, 21, 0.9);
            border: 1.5px solid rgba(168, 255, 62, 0.35);
            backdrop-filter: blur(6px);
            transition: all 0.4s ease;
            animation: stepPulse 3s ease-in-out infinite;

        .side-step:nth-child(2) { animation-delay: 0s; }
        .side-step:nth-child(3) { animation-delay: 0.6s; }
        .side-step:nth-child(4) { animation-delay: 1.2s; }
        .side-step:nth-child(5) { animation-delay: 1.8s; }
        .side-step:nth-child(6) { animation-delay: 2.4s; }

        @keyframes stepPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(168, 255, 62, 0.4);
                border-color: rgba(168, 255, 62, 0.35);

                box-shadow: 0 0 0 8px rgba(168, 255, 62, 0);
                border-color: var(--accent);

            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);

            border-color: var(--accent);

                this.el = document.createElement('a');
                this.el.className = 'bubble';
                this.el.href = data.url;
                this.el.target = '_blank';
                this.el.rel = 'noopener';
                this.el.style.width = this.size + 'px';

                this.el.style.setProperty('--bubble-color', data.color);
                this.el.style.setProperty('--bubble-light', data.light);

                this.el.style.setProperty('--bubble-glow',  this.hexToRgba(data.color, 0.55));

                        ${data.icon}
                        ${data.fallback}
                    </div>
                    <div class="bubble-label">${data.label}</div>
                `;
                arena.appendChild(this.el);
                setTimeout(() => { this.el.style.opacity = '1'; }, Math.random() * 400);
            }

            hexToRgba(hex, alpha) {
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const n = parseInt(hex, 16);
                const r = (n >> 16) & 0xff;
                const g = (n >> 8) & 0xff;
                const b = n & 0xff;
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            update(dt, width, height) {
                this.x += this.vx;
                this.y += this.vy;
                this.wobblePhase += this.wobbleSpeed * 0.05;
                const wobbleX = Math.sin(this.wobblePhase) * 4;
                const wobbleY = Math.cos(this.wobblePhase * 1.3) * 4;
                const r = this.size / 2;
                const mx = this.x + wobbleX;
                const my = this.y + wobbleY;
                if (mx - r < 0) { this.x = r; this.vx = Math.abs(this.vx); }
                else if (mx + r > width) { this.x = width - r; this.vx = -Math.abs(this.vx); }
                if (my - r < 0) { this.y = r; this.vy = Math.abs(this.vy); }
                else if (my + r > height) { this.y = height - r; this.vy = -Math.abs(this.vy); }
                this.el.style.transform = `translate(${this.x - r + wobbleX}px, ${this.y - r + wobbleY}px)`;
            }

                            <feGaussianBlur stdDeviation="2.5" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    ${items}
                </svg>
            `;
        }

        function renderCryptoView() {
            const container = document.getElementById('crypto-view');
            if (!container || container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            const cardsHTML = CRYPTO_POSTS.map((p, i) => `
                <div class="crypto-card crypto-card-${i + 1}"
                     data-crypto-index="${i}"
                     role="button"
                     tabindex="0"
                     aria-label="Открыть пост: ${p.title}">
                    <div class="crypto-card-image"
                         style="background-image: url('${p.image}'); background-color: ${p.color};">
                        <div class="crypto-card-glass-icon">
                            ${p.icon}
                        </div>
                    </div>
                    <div class="crypto-card-body">
                        <h3>${p.title}</h3>
                        <p>${p.excerpt}</p>
                    </div>
                </div>
            `).join('');

            const assetsHTML = ASSETS.map(a => `
                <div class="crypto-asset-card">
                    <div class="crypto-asset-head">
                        <div class="crypto-asset-icon" style="background: ${a.color}25; color: ${a.color}; border-color: ${a.color}50;">
                            ${a.icon}
                        </div>
                        <div class="crypto-asset-info">
                            <strong>${a.name}</strong>
                            <span class="crypto-asset-price">$ ${a.price.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="crypto-asset-sparkline">
                        ${a.change >= 0
                            ? `<svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline points="0,22 15,20 30,23 45,17 60,18 75,12 90,13 100,10"
                                          fill="none" stroke="#16a34a" stroke-width="1.8"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                              </svg>`
                            : `<svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline points="0,10 15,12 30,9 45,14 60,13 75,17 90,18 100,20"
                                          fill="none" stroke="#dc2626" stroke-width="1.8"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                              </svg>`
                        }
                    </div>
                    <span class="crypto-asset-change ${a.change >= 0 ? 'up' : 'down'}">
                        ${a.change >= 0 ? '+' : ''}${a.change.toFixed(2)}%
                    </span>
                </div>
            `).join('');

            const cx = 750, cy = 550;
            const raysHTML = CRYPTO_POSTS.map((p, i) => {
                const angleDeg = i * 40 - 90;
                const angleRad = angleDeg * Math.PI / 180;
                const startR = 110;
                const endR = CARD_RADIUS - 20;
                const x1 = cx + Math.cos(angleRad) * startR;
                const y1 = cy + Math.sin(angleRad) * startR;
                const x2 = cx + Math.cos(angleRad) * endR;
                const y2 = cy + Math.sin(angleRad) * endR;
                return `
                    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />
                    <circle cx="${x2}" cy="${y2}" r="3" />
                `;
            }).join('');

            container.innerHTML = `
                <div class="crypto-stage posts-hidden">
                    <div class="crypto-posts-hint">Нажмите на Bitcoin, чтобы открыть посты</div>
                    <div class="crypto-rays">
                        <svg viewBox="0 0 1500 1100" preserveAspectRatio="xMidYMid meet">
                            ${raysHTML}
                        </svg>
                    </div>

                    <div class="crypto-center">
                        <div class="crypto-center-glow"></div>

                        <div class="crypto-rotor">
                            ${buildRotorSVG()}
                        </div>

                        <div class="crypto-coin" role="button" tabindex="0" aria-label="Показать посты вокруг Bitcoin">
                            <img src="icons/c_w.png" alt="Bitcoin"
                                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                            <div class="crypto-coin-fallback" style="display:none;">₿</div>
                        </div>
                    </div>
                    ${cardsHTML}
                </div>
                <div class="crypto-secondary-coin" role="button" tabindex="0" aria-label="Будущая монета для новых постов">
                    <img src="icons/b_w.png" alt="Новая монета"
                         onerror="this.style.display='none';">
                </div>
                <div class="crypto-assets">
                    <h2>Актуальные активы</h2>
                    <div class="crypto-assets-list">
                        ${assetsHTML}
                    </div>
                </div>
            `;

            const modal         = document.getElementById('crypto-modal');
            const modalImage    = document.getElementById('crypto-modal-image');
            const modalImg      = document.getElementById('crypto-modal-img');
            const modalTitle    = document.getElementById('crypto-modal-title');
            const modalText     = document.getElementById('crypto-modal-text');
            const modalTelegram = document.getElementById('crypto-modal-telegram');

            const openCryptoModal = (index) => {
                const post = CRYPTO_POSTS[index];
                if (!post || !modal) return;

                modalImg.src = post.image;
                modalImg.alt = post.title;
                modalImage.style.backgroundColor = post.color;

                modalTitle.textContent = post.title;
                modalText.textContent  = post.fullText;
                modalTelegram.href     = post.url;

                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('crypto-modal-open');
                modal.querySelector('.crypto-modal-close').focus();
            };

            const closeCryptoModal = () => {
                if (!modal) return;
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('crypto-modal-open');
            };

            const cryptoStage = container.querySelector('.crypto-stage');
            const cryptoCoin = container.querySelector('.crypto-coin');

            const toggleCryptoPosts = () => {
                if (!cryptoStage) return;

                const willOpen = cryptoStage.classList.contains('posts-hidden');
                const cards = Array.from(cryptoStage.querySelectorAll('.crypto-card'));

                if (willOpen) {
                    // Открываем посты медленно и последовательно.
                    cryptoStage.classList.remove('posts-hidden');

                    requestAnimationFrame(() => {
                        cards.forEach((card, index) => {
                            const startDelay = index * 0.65;
                            const wobbleDelay = startDelay + 1.15;

                            card.style.animation = [
                                `cryptoCardIn 1.15s cubic-bezier(0.22, 1, 0.36, 1) both ${startDelay}s`,
                                `cardWobble 6s ease-in-out infinite ${wobbleDelay}s`
                            ].join(', ');
                        });
                    });
                } else {
                    // При повторном закрытии возвращаем исходное состояние.
                    cards.forEach((card) => {
                        card.style.animation = 'none';
                    });
                    cryptoStage.classList.add('posts-hidden');
                }
            };

            if (cryptoCoin) {
                cryptoCoin.addEventListener('click', toggleCryptoPosts);
                cryptoCoin.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleCryptoPosts();
                    }
                });
            }

            container.querySelectorAll('.crypto-card').forEach((card) => {
                const index = Number(card.dataset.cryptoIndex);

                card.addEventListener('click', () => openCryptoModal(index));

                card.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openCryptoModal(index);
                    }
                });
            });

            modal.querySelectorAll('[data-close-crypto-modal]').forEach((element) => {
                element.addEventListener('click', closeCryptoModal);
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal?.classList.contains('open')) {
                    closeCryptoModal();
                }
            });
        }

        function buildSidePanels() {
            const leftHTML = `
                <aside class="mypath-side-left">
                    <div class="side-label">Путь · Шаги · Рост</div>
                    <div class="side-track">
                        <div class="side-track-line"></div>
                        <div class="side-step side-step-active"></div>
                        <div class="side-step"></div>
                        <div class="side-step"></div>
                        <div class="side-step"></div>
                        <div class="side-step"></div>
                        <div class="side-step"></div>
                        <div class="side-compass">
                            ${MYPATH_ICONS.compassBig}
                        </div>
                    </div>
                </aside>
            `;

            const coins = [
                { cls: 'side-coin-1', sym: '₿' },
                { cls: 'side-coin-2', sym: 'Ξ' },
                { cls: 'side-coin-3', sym: '◎' },
                { cls: 'side-coin-4', sym: '$' },
                { cls: 'side-coin-5', sym: '₽' },
                { cls: 'side-coin-6', sym: '¥' },
                { cls: 'side-coin-7', sym: '€' },
            ];

            const coinsHTML = coins.map(c => `
                <div class="side-coin ${c.cls}">${c.sym}</div>
            `).join('');

            let particlesHTML = '';
            for (let i = 0; i < 18; i++) {
                const left = Math.random() * 100;
                const duration = 6 + Math.random() * 8;
                const delay = Math.random() * 8;
                const size = 1 + Math.random() * 2;
                particlesHTML += `<span class="side-particle" style="left: ${left}%; bottom: -20px; width: ${size}px; height: ${size}px; animation-duration: ${duration}s; animation-delay: ${delay}s;"></span>`;
            }

            const rightHTML = `
                <aside class="mypath-side-right">
                    <div class="side-floaters">
                        ${coinsHTML}
                        <div class="side-particles">
                            ${particlesHTML}
                        </div>
                    </div>
                </aside>
            `;

            return { leftHTML, rightHTML };
        }

        function renderMypathView() {
            const container = document.getElementById('mypath-view');
            if (!container || container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            const hero = MYPATH.hero;
            const { leftHTML, rightHTML } = buildSidePanels();

            const cardsHTML = MYPATH.cards.map(card => `
                <a href="${card.link}" class="mypath-card" data-card-link="${card.link}" onclick="event.preventDefault();">
                    <div class="mypath-card-info">
                        <div class="mypath-card-icon">
                            ${MYPATH_ICONS[card.icon] || MYPATH_ICONS.doc}
                        </div>
                        <h3>${card.title}</h3>
                        <p>${card.text}</p>
                        ${card.soon
                            ? `<span class="mypath-card-btn soon">
                                <span class="btn-icon">${MYPATH_ICONS.hourglass}</span>
                                <span>Скоро</span>
                                <span class="btn-arrow">${MYPATH_ICONS.arrow}</span>
                               </span>`
                            : `<span class="mypath-card-btn">
                                <span>Открыть</span>
                                <span class="btn-arrow">${MYPATH_ICONS.arrow}</span>
                               </span>`
                        }
                    </div>
                    <div class="mypath-card-visual" style="background-image: url('${card.image}');"></div>
                </a>
            `).join('');

            // Превью поста: короткий текст + три точки
            const postsHTML = MYPATH.posts.map((post, i) => {
                const shortText = post.text.length > 180
                    ? post.text.slice(0, 160).trim() + '…'
                    : post.text;
                return `
                <div class="mypath-post" data-post-index="${i}">
                    <div class="mypath-post-image" style="background-image: url('${post.image}');"></div>
                    <div class="mypath-post-body">
                        <span class="mypath-post-tag">${post.tag}</span>
                        <h3 class="mypath-post-title">${post.title}</h3>
                        <p class="mypath-post-text">${shortText}</p>
                        <div class="mypath-post-dots">• • •</div>
                    </div>
                </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="mypath-layout">
                    ${leftHTML}
                    <div class="mypath-main">

                        <section class="mypath-hero">
                            <div class="mypath-hero-text">
                                <h1 class="mypath-hero-title">
                                    <span class="line1">${hero.line1}</span>
                                    <span class="line2">${hero.line2}</span>
                                </h1>
                                <p>${hero.text}</p>
                            </div>
                        </section>

                        <section class="mypath-section">
                            <div class="mypath-section-title">
                                <div class="mypath-section-icon">
                                    ${MYPATH_ICONS.compass}
                                </div>
                                <h2>Мой путь</h2>
                                <div class="line"></div>
                            </div>
                            <p class="mypath-section-subtitle">Разделы моего пути. Здесь — то, что формирует меня.</p>

                            <div class="mypath-cards">
                                ${cardsHTML}
                            </div>
                        </section>

                        <section class="mypath-section" id="mypath-posts-section">
                            <div class="mypath-section-title">
                                <div class="mypath-section-icon">
                                    ${MYPATH_ICONS.doc}
                                </div>
                                <h2>Посты</h2>
                                <div class="line"></div>
                            </div>

                            <div class="mypath-posts" id="mypath-posts">
                                ${postsHTML}
                            </div>
                        </section>

                        <div class="mypath-footer">
                            Всё самое интересное ещё впереди
                        </div>

                    </div>
                    ${rightHTML}
                </div>
            `;

            container.querySelectorAll('.mypath-card').forEach(cardEl => {
                cardEl.addEventListener('click', function(e) {
                    e.preventDefault();
                    const link = this.dataset.cardLink;
                    if (link === 'posts') {
                        const postsSection = document.getElementById('mypath-posts-section');
                        if (postsSection) {
                            postsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }
                });
            });

            /* ===== Модальное окно для постов "Мой путь" ===== */
            const mypathModal      = document.getElementById('mypath-modal');
            const mypathModalImg   = document.getElementById('mypath-modal-img');
            const mypathModalImage = document.getElementById('mypath-modal-image');
            const mypathModalTag   = document.getElementById('mypath-modal-tag');
            const mypathModalTitle = document.getElementById('mypath-modal-title');
            const mypathModalText  = document.getElementById('mypath-modal-text');
            const mypathModalTg    = document.getElementById('mypath-modal-telegram');

            const openMypathModal = (index) => {
                const post = MYPATH.posts[index];
                if (!post || !mypathModal) return;

                mypathModalImg.src = post.image;
                mypathModalImg.alt = post.title;
                mypathModalImage.style.backgroundColor = '#0a1310';

                mypathModalTag.textContent   = post.tag;
                mypathModalTitle.textContent = post.title;
                mypathModalText.textContent  = post.text;
                mypathModalTg.href           = post.url;

                mypathModal.classList.add('open');
                mypathModal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('crypto-modal-open');
                mypathModal.querySelector('.crypto-modal-close').focus();
            };

            const closeMypathModal = () => {
                if (!mypathModal) return;
                mypathModal.classList.remove('open');
                mypathModal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('crypto-modal-open');
            };

            container.querySelectorAll('.mypath-post').forEach(postEl => {
                const index = parseInt(postEl.dataset.postIndex, 10);

                postEl.addEventListener('click', function(e) {
                    if (e.target.closest('a')) return;
                    openMypathModal(index);
                });

                postEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openMypathModal(index);
                    }
                });
            });

            mypathModal.querySelectorAll('[data-close-mypath-modal]').forEach(el => {
                el.addEventListener('click', closeMypathModal);
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && mypathModal?.classList.contains('open')) {
                    closeMypathModal();
                }
            });
        }

        const bubblesView = document.getElementById('bubbles-view');
        const bubbles = [];

        function createBubbles() {
            bubblesView.querySelectorAll('.bubble').forEach(el => el.remove());
            bubbles.length = 0;
            PLATFORMS.forEach(data => bubbles.push(new Bubble(data, bubblesView)));
        }

        function animate() {
            const w = bubblesView.clientWidth;
            const h = bubblesView.clientHeight;
            bubbles.forEach(b => b.update(1, w, h));
            requestAnimationFrame(animate);
        }

        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                document.documentElement.setAttribute('data-view', view);
                localStorage.setItem('werth69-view', view);
                viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view));
                if (view === 'bubbles') {
                    requestAnimationFrame(() => createBubbles());
                }
                if (view === 'crypto') {
                    renderCryptoView();
                }
                if (view === 'mypath') {
                    renderMypathView();
                }
            });
        });

        let initialView = document.documentElement.getAttribute('data-view') || 'bubbles';
        if (window.matchMedia('(max-width: 768px)').matches && initialView === 'bubbles') {
            initialView = 'list';
            document.documentElement.setAttribute('data-view', initialView);
            localStorage.setItem('werth69-view', initialView);
        }
        viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === initialView));

        window.addEventListener('resize', () => {
            if (window.matchMedia('(max-width: 768px)').matches &&
                document.documentElement.getAttribute('data-view') === 'bubbles') {
                document.documentElement.setAttribute('data-view', 'list');
                localStorage.setItem('werth69-view', 'list');
                viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === 'list'));
            }
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const w = bubblesView.clientWidth, h = bubblesView.clientHeight;
                bubbles.forEach(b => {
                    const r = b.size / 2;
                    if (b.x - r < 0) b.x = r;
                    if (b.x + r > w) b.x = w - r;
                    if (b.y - r < 0) b.y = r;
                    if (b.y + r > h) b.y = h - r;
                });
            }, 150);
        });

        requestAnimationFrame(() => {
            createBubbles();
            animate();
            renderCards();
            if (initialView === 'crypto') {
                renderCryptoView();
            }
            if (initialView === 'mypath') {
                renderMypathView();
            }
        });
    </script>
</body>
</html>
