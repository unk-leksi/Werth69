<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werth69 | Investments for a brighter future</title>

    <link rel="icon" type="image/png" href="icons/logo.png">
    <link rel="apple-touch-icon" href="icons/logo.png">

    <script>
        (function () {
            const saved = localStorage.getItem('werth69-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            const savedView = localStorage.getItem('werth69-view') || 'bubbles';
            document.documentElement.setAttribute('data-view', savedView);
        })();
    </script>

    <style>
        :root,
        [data-theme="light"] {
            --bg-base:      #eef5e3;
            --bg-card:      #ffffff;
            --bg-card-hover:#f6faee;
            --text:         #0f1a0a;
            --text-muted:   #5f6b52;
            --text-invert:  #ffffff;
            --border:       rgba(95, 191, 0, 0.20);
            --border-soft:  #e6eed7;
            --accent:       #5fbf00;
            --accent-hover: #4fa600;
            --accent-soft:  #e6f7cc;
            --accent-glow:  rgba(124, 255, 0, 0.35);
            --bg-grad-1:  rgba(124, 255, 0, 0.18);
            --bg-grad-2:  rgba(95, 191, 0, 0.10);
            --bg-grad-3:  rgba(80, 160, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-base:      #070b05;
            --bg-card:      #0e1409;
            --bg-card-hover:#131a0d;
            --text:         #e8f5dd;
            --text-muted:   #8b9a7a;
            --text-invert:  #0a0e08;
            --border:       rgba(124, 255, 43, 0.15);
            --border-soft:  #1f2a1a;
            --accent:       #a8ff3e;
            --accent-hover: #c0ff6a;
            --accent-soft:  #1e2c10;
            --accent-glow:  rgba(168, 255, 62, 0.55);
            --bg-grad-1:  rgba(124, 255, 43, 0.14);
            --bg-grad-2:  rgba(80, 180, 30, 0.08);
            --bg-grad-3:  rgba(20, 60, 10, 0.20);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, Tahoma, sans-serif;
            color: var(--text);
            transition: background 0.4s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 15% 15%, var(--bg-grad-1) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, var(--bg-grad-2) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, var(--bg-grad-3) 0%, transparent 70%),
                var(--bg-base);
            background-attachment: fixed;
            animation: bgPulse 12s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%, 0 0; }
            50%      { background-position: 5% 5%, 95% 95%, 50% 50%, 0 0; }
        }

        /* ============ ТОПБАР ============ */
        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 28px;
            background-color: rgba(10, 14, 8, 0.78);
            border: none;
            z-index: 100;
            flex-shrink: 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            animation: topbarSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            isolation: isolate;
        }

        @keyframes topbarSlide {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        [data-theme="light"] .topbar {
            background-color: rgba(30, 40, 25, 0.55);
        }

        .topbar::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("icons/header-bg.png");
            background-size: cover;
            background-position: center right;
            z-index: -2;
            animation: bgZoom 30s ease-in-out infinite alternate;
        }

        @keyframes bgZoom {
            0%   { transform: scale(1.00); }
            50%  { transform: scale(1.03); }
            100% { transform: scale(1.00); }
        }

        .topbar .topbar-shade {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                rgba(10, 14, 8, 0.88) 0%,
                rgba(10, 14, 8, 0.55) 40%,
                rgba(10, 14, 8, 0.55) 60%,
                rgba(10, 14, 8, 0.88) 100%
            );
        }

        [data-theme="light"] .topbar .topbar-shade {
            background: linear-gradient(
                90deg,
                rgba(20, 30, 15, 0.65) 0%,
                rgba(20, 30, 15, 0.25) 40%,
                rgba(20, 30, 15, 0.25) 60%,
                rgba(20, 30, 15, 0.65) 100%
            );
        }

        .topbar::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            background-image: linear-gradient(
                115deg,
                transparent 0%,
                transparent 30%,
                rgba(168, 255, 62, 0.35) 45%,
                rgba(220, 255, 180, 0.5) 50%,
                rgba(168, 255, 62, 0.35) 55%,
                transparent 70%,
                transparent 100%
            );
            background-size: 220% 100%;
            background-repeat: no-repeat;
            background-position: -100% 0;
            animation: lightSweep 14s linear infinite;
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0.7;
        }

        .topbar .light-beam {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background-image: linear-gradient(
                115deg,
                transparent 0%,
                transparent 40%,
                rgba(220, 255, 180, 0.3) 48%,
                rgba(168, 255, 62, 0.45) 52%,
                transparent 60%,
                transparent 100%
            );
            background-size: 200% 100%;
            background-position: -100% 0;
            background-repeat: no-repeat;
            mix-blend-mode: screen;
            opacity: 0.6;
            animation: lightSweep 14s linear infinite;
            animation-delay: 7s;
        }

        @keyframes lightSweep {
            0%   { background-position: -100% 0; }
            100% { background-position: 220% 0; }
        }

        [data-theme="light"] .topbar::after,
        [data-theme="light"] .topbar .light-beam {
            opacity: 0.9;
            mix-blend-mode: screen;
            filter: brightness(0.6) contrast(1.8) saturate(1.5);
        }

        .brand,
        .view-switch,
        .topbar-actions {
            position: relative;
            z-index: 4;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            box-shadow: 0 0 20px var(--accent-glow);
            flex-shrink: 0;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-3px); }
        }

        .brand-logo:hover {
            transform: scale(1.08);
            box-shadow: 0 0 32px var(--accent-glow);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .brand-text h1 span {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
            animation: accentPulse 3s ease-in-out infinite;
        }

        @keyframes accentPulse {
            0%, 100% { text-shadow: 0 0 12px var(--accent-glow); }
            50%      { text-shadow: 0 0 22px var(--accent-glow), 0 0 32px var(--accent-glow); }
        }

        .brand-tagline {
            margin: 2px 0 0;
            font-size: 10px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: #d5e6c5;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .view-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(168, 255, 62, 0.35);
            border-radius: 999px;
            padding: 4px;
            gap: 2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #d5e6c5;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            white-space: nowrap;
        }

        .view-btn svg {
            width: 17px;
            height: 17px;
            display: block;
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .view-btn:hover svg { transform: scale(1.15); }
        .view-btn:hover { color: #ffffff; }

        .view-btn.active {
            background: var(--accent);
            color: var(--text-invert);
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .theme-toggle {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(168, 255, 62, 0.35);
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            display: block;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        [data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
        [data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }

        .theme-toggle:hover {
            background: var(--accent);
            color: var(--text-invert);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ============ АРЕНА ============ */
        .arena {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        html[data-view="bubbles"] .list-view,
        html[data-view="bubbles"] .crypto-view { display: none; }
        html[data-view="list"]   .bubbles-view,
        html[data-view="list"]   .crypto-view { display: none; }
        html[data-view="crypto"] .bubbles-view,
        html[data-view="crypto"] .list-view { display: none; }

        .bubbles-view, .list-view, .crypto-view {
            animation: viewFadeIn 0.5s ease both;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ ПУЗЫРЬКИ ============ */
        .bubbles-view {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            padding: 0;
            opacity: 0;
            transition: opacity 0.8s ease, filter 0.3s ease, box-shadow 0.3s ease;
            background: radial-gradient(
                circle at 50% 40%,
                var(--bubble-light) 0%,
                var(--bubble-color) 55%,
                var(--bubble-dark) 100%
            );
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.20),
                0 0 28px var(--bubble-glow),
                0 12px 32px rgba(0, 0, 0, 0.55);
            will-change: transform;
            z-index: 1;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center top, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .bubble-icon {
            width: 52%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            margin-bottom: 6px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bubble-icon svg {
            width: 100%; height: 100%;
            fill: #ffffff;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
        }

        .bubble-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .bubble-label {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            padding: 0 6px;
        }

        .bubble:hover {
            filter: brightness(1.2);
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.4),
                inset 0 0 45px rgba(255, 255, 255, 0.35),
                0 0 50px var(--bubble-glow),
                0 14px 42px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        /* ============ СПИСОК ============ */
        .list-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            padding: 32px 40px 60px;
            z-index: 1;
        }

        .list-header {
            max-width: 900px;
            margin: 0 auto 28px;
        }

        .list-header h2 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .list-header h2 span {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .list-header p {
            margin: 0;
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cards {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--card-color);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }

        .card-pattern {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.10;
            z-index: 0;
            background-repeat: repeat;
            background-size: 90px 90px;
            mix-blend-mode: multiply;
        }

        [data-theme="dark"] .card-pattern {
            opacity: 0.14;
            mix-blend-mode: screen;
        }

        .card:hover {
            transform: translateX(8px) scale(1.005);
            background: var(--bg-card-hover);
            border-left-width: 6px;
            box-shadow: 0 10px 32px var(--card-glow);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                circle at 40% 35%,
                var(--card-light) 0%,
                var(--card-color) 60%,
                var(--card-dark) 100%
            );
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25), 0 4px 16px var(--card-glow);
            position: relative;
            z-index: 2;
        }

        .card-icon-inner {
            width: 58%;
            height: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg { width: 100%; height: 100%; fill: #ffffff; display: block; }
        .card-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .card-body {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        .card-title {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
        }

        .card-desc {
            margin: 0;
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-arrow {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.10);
            color: var(--card-light);
            font-size: 18px;
            font-weight: 800;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
            border: 1.5px solid var(--card-light);
        }

        .card:hover .card-arrow {
            background: var(--card-color);
            color: #ffffff;
            transform: translateX(6px) scale(1.12);
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            padding: 11px 22px;
            background: rgba(19, 24, 19, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            z-index: 50;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            animation: hintFloat 5s ease-in-out infinite;
        }

        @keyframes hintFloat {
            0%, 100% { opacity: 0.75; transform: translateX(-50%) translateY(0); }
            50%      { opacity: 1;    transform: translateX(-50%) translateY(-3px); }
        }

        html[data-view="list"] .hint,
        html[data-view="crypto"] .hint { display: none; }

        /* ============================================================
           КРИПТОКОНЦЕПЦИИ
           ============================================================ */
        .crypto-view {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            padding: 20px 0 60px;
        }

        .crypto-stage {
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            height: 1150px;
        }

        .crypto-stage::before,
        .crypto-stage::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(168, 255, 62, 0.18);
            pointer-events: none;
            z-index: 1;
        }

        .crypto-stage::before {
            width: 1000px;
            height: 1000px;
        }

        .crypto-stage::after {
            width: 700px;
            height: 700px;
            border-color: rgba(168, 255, 62, 0.12);
        }

        /* ========== Центральный Bitcoin ========== */
        .crypto-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .crypto-center-glow {
            position: absolute;
            inset: -60%;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(247, 147, 26, 0.50) 0%,
                rgba(247, 147, 26, 0.15) 40%,
                transparent 70%);
            animation: cryptoPulse 4s ease-in-out infinite;
        }

        @keyframes cryptoPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50%      { transform: scale(1.15); opacity: 1; }
        }

        .crypto-center-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 60px rgba(247, 147, 26, 0.85));
            position: relative;
            z-index: 2;
            animation: cryptoFloat 6s ease-in-out infinite;
        }

        @keyframes cryptoFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50%      { transform: translateY(-12px) rotate(2deg); }
        }

        .crypto-center-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #FFD54D 0%, #F7931A 50%, #B86A00 100%);
            color: #ffffff;
            font-size: 140px;
            font-weight: 900;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 80px rgba(247, 147, 26, 0.8),
                inset 0 0 50px rgba(0, 0, 0, 0.35);
            font-family: 'Georgia', serif;
            position: relative;
            z-index: 2;
        }

        /* ============================================================
           9 КАРТОЧЕК — крупные и читаемые
           ============================================================ */
        .crypto-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 250px;
            margin-left: -150px;
            margin-top: -125px;

            --angle: 0deg;
            --radius: 400px;

            transform:
                rotate(var(--angle))
                translate(0, calc(-1 * var(--radius)))
                rotate(calc(-1 * var(--angle)));

            transform-origin: 50% 50%;

            background: rgba(10, 14, 8, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(168, 255, 62, 0.22);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
            z-index: 3;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
            opacity: 0;
            animation: cryptoCardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        [data-theme="light"] .crypto-card {
            background: rgba(15, 20, 12, 0.94);
            border-color: rgba(124, 255, 43, 0.30);
        }

        @keyframes cryptoCardIn {
            from { opacity: 0; transform: rotate(var(--angle)) translate(0, calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle))) scale(0.85); }
            to   { opacity: 1; transform: rotate(var(--angle)) translate(0, calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle))) scale(1); }
        }

        .crypto-card:hover {
            transform:
                rotate(var(--angle))
                translate(0, calc(-1 * var(--radius)))
                rotate(calc(-1 * var(--angle)))
                scale(1.05);
            border-color: var(--accent);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.7),
                0 0 40px var(--accent-glow);
            z-index: 20;
        }

        .crypto-card-1 { --angle: 0deg;   animation-delay: 0.05s; }
        .crypto-card-2 { --angle: 40deg;  animation-delay: 0.10s; }
        .crypto-card-3 { --angle: 80deg;  animation-delay: 0.15s; }
        .crypto-card-4 { --angle: 120deg; animation-delay: 0.20s; }
        .crypto-card-5 { --angle: 160deg; animation-delay: 0.25s; }

        .crypto-card-7 { --angle: 240deg; animation-delay: 0.35s; }
        .crypto-card-8 { --angle: 280deg; animation-delay: 0.40s; }
        .crypto-card-9 { --angle: 320deg; animation-delay: 0.45s; }

        /* -------- Картинка карточки -------- */
        .crypto-card-image {
            height: 120px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .crypto-card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
            pointer-events: none;
        }

        .crypto-card-tag {
            position: absolute;
            top: 12px;
            left: 14px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            z-index: 2;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            backdrop-filter: blur(6px);
        }

        .crypto-card-emoji {
            font-size: 46px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
            position: relative;
            z-index: 1;
        }

        /* -------- Тело карточки -------- */
        .crypto-card-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow: hidden;
        }

        .crypto-card-body h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
        }

            font-size: 12px;
            color: #b8c9a8;
            line-height: 1.5;
            display: -webkit-box;

            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .crypto-assets {
            max-width: 1300px;
            margin: 20px auto 0;
            padding: 0 40px;
        }

            margin: 0 0 20px;
            font-size: 26px;
            font-weight: 900;

            gap: 16px;

            display: flex;

            border-radius: 14px;

            width: 100%;
            height: 100%;
            display: block;

            font-size: 13px;

        }

        .crypto-asset-change.up { color: #16a34a; }

                grid-template-columns: repeat(2, 1fr);

        }

        /* ============================================================
           АКТУАЛЬНЫЕ АКТИВЫ
           ============================================================ */
        const ASSETS = [
            { symbol: 'BTC',  name: 'Bitcoin',  price: 67432.12, change:  2.48, icon: '₿', color: '#F7931A' },
            { symbol: 'ETH',  name: 'Ethereum', price: 3245.67,  change:  3.12, icon: 'Ξ', color: '#627EEA' },
            { symbol: 'SOL',  name: 'Solana',   price: 142.08,   change:  4.12, icon: '◎', color: '#9945FF' },
            { symbol: 'AAPL', name: 'Apple',    price: 188.32,   change:  1.56, icon: 'A', color: '#A2AAAD' },
            { symbol: 'TSLA', name: 'Tesla',    price: 242.16,   change: -2.87, icon: 'T', color: '#E31937' },
        ];

        const BUBBLE_SIZE = 180;

        class Bubble {
            constructor(data, arena) {
                this.data = data;
                this.arena = arena;
                this.size = BUBBLE_SIZE;
                this.x = Math.random() * (arena.clientWidth - this.size - 40) + this.size / 2 + 20;
                this.y = Math.random() * (arena.clientHeight - this.size - 40) + this.size / 2 + 20;
                const speedBase = 0.7;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speedBase;
                this.vy = Math.sin(angle) * speedBase;
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.6 + Math.random() * 0.4;
                this.el = document.createElement('a');
                this.el.className = 'bubble';
                this.el.href = data.url;
                this.el.target = '_blank';
                this.el.rel = 'noopener';
                this.el.style.width = this.size + 'px';
                this.el.style.height = this.size + 'px';
                this.el.style.setProperty('--bubble-color', data.color);
                this.el.style.setProperty('--bubble-light', data.light);
                this.el.style.setProperty('--bubble-dark',  data.dark);
                this.el.style.setProperty('--bubble-glow',  this.hexToRgba(data.color, 0.55));
                this.el.innerHTML = `
                    <div class="bubble-icon">
                        ${data.icon}
                        ${data.fallback}
                    </div>
                    <div class="bubble-label">${data.label}</div>
                `;
                arena.appendChild(this.el);
                setTimeout(() => { this.el.style.opacity = '1'; }, Math.random() * 400);
            }

            hexToRgba(hex, alpha) {
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const n = parseInt(hex, 16);
                const r = (n >> 16) & 0xff;
                const g = (n >> 8) & 0xff;
                const b = n & 0xff;
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            update(dt, width, height) {
                this.x += this.vx;
                this.y += this.vy;
                this.wobblePhase += this.wobbleSpeed * 0.05;
                const wobbleX = Math.sin(this.wobblePhase) * 4;
                const wobbleY = Math.cos(this.wobblePhase * 1.3) * 4;
                const r = this.size / 2;
                const mx = this.x + wobbleX;
                const my = this.y + wobbleY;
                if (mx - r < 0) { this.x = r; this.vx = Math.abs(this.vx); }
                else if (mx + r > width) { this.x = width - r; this.vx = -Math.abs(this.vx); }
                if (my - r < 0) { this.y = r; this.vy = Math.abs(this.vy); }
                else if (my + r > height) { this.y = height - r; this.vy = -Math.abs(this.vy); }
                this.el.style.transform = `translate(${this.x - r + wobbleX}px, ${this.y - r + wobbleY}px)`;
            }
        }

        function hexToRgba(hex, alpha) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const n = parseInt(hex, 16);
            const r = (n >> 16) & 0xff;
            const g = (n >> 8) & 0xff;
            const b = n & 0xff;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function buildPatternDataUrl(svg, color) {
            const size = 90;
            const iconSize = 26;
            const offset = (size - iconSize) / 2;
            const wrapped = `
                <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                    <g transform="translate(${offset}, ${offset})" fill="${color}" opacity="0.65">
                        <g transform="scale(${iconSize / 24})">
                            ${svg.replace(/<svg[^>]*>|<\/svg>/g, '')}
                        </g>
                    </g>
                </svg>
            `;
            return `url("data:image/svg+xml;charset=UTF-8,${encodeURIComponent(wrapped)}")`;
        }

        function renderCards() {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            PLATFORMS.forEach(data => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = data.url;
                card.target = '_blank';
                card.rel = 'noopener';
                card.style.setProperty('--card-color', data.color);
                card.style.setProperty('--card-light', data.light);
                card.style.setProperty('--card-dark',  data.dark);
                card.style.setProperty('--card-glow',  hexToRgba(data.light, 0.45));
                card.innerHTML = `
                    <div class="card-pattern" style="background-image: ${buildPatternDataUrl(data.pattern, data.color)};"></div>
                    <div class="card-icon">
                        <div class="card-icon-inner">
                            ${data.icon}
                            ${data.fallback}
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${data.label}</h3>
                        <p class="card-desc">${data.description}</p>
                    </div>
                    <div class="card-arrow">→</div>
                `;
                container.appendChild(card);
            });
        }

        function renderCryptoView() {
            const container = document.getElementById('crypto-view');
            if (!container || container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            const cardsHTML = CRYPTO_POSTS.map((p, i) => `
                <a href="#" class="crypto-card crypto-card-${i + 1}" onclick="event.preventDefault();">
                    <div class="crypto-card-image"
                         style="background-image: url('${p.image}'); background-color: ${p.color};">
                        <span class="crypto-card-tag">${p.tag}</span>
                        <span class="crypto-card-emoji">${p.emoji}</span>
                    </div>
                    <div class="crypto-card-body">
                        <h3>${p.title}</h3>
                        <p>${p.excerpt}</p>
                    </div>
                </a>
            `).join('');

            const assetsHTML = ASSETS.map(a => `
                <div class="crypto-asset-card">
                    <div class="crypto-asset-head">
                        <div class="crypto-asset-icon" style="background: ${a.color}25; color: ${a.color}; border-color: ${a.color}50;">
                            ${a.icon}
                        </div>
                        <div class="crypto-asset-info">
                            <strong>${a.name}</strong>
                            <span class="crypto-asset-price">$ ${a.price.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="crypto-asset-sparkline">
                        ${a.change >= 0
                            ? `<svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline points="0,22 15,20 30,23 45,17 60,18 75,12 90,13 100,10"
                                          fill="none" stroke="#16a34a" stroke-width="1.8"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                              </svg>`
                            : `<svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline points="0,10 15,12 30,9 45,14 60,13 75,17 90,18 100,20"
                                          fill="none" stroke="#dc2626" stroke-width="1.8"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                              </svg>`
                        }
                    </div>
                    <span class="crypto-asset-change ${a.change >= 0 ? 'up' : 'down'}">
                        ${a.change >= 0 ? '+' : ''}${a.change.toFixed(2)}%
                    </span>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="crypto-stage">
                    <div class="crypto-center">
                        <div class="crypto-center-glow"></div>
                        <img src="icons/bitcoin-hero.png"
                             alt="Bitcoin"
                             class="crypto-center-img"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                        <div class="crypto-center-fallback">₿</div>
                    </div>
                    ${cardsHTML}
                </div>
                <div class="crypto-assets">
                    <h2>Актуальные активы</h2>
                    <div class="crypto-assets-list">
                        ${assetsHTML}
                    </div>
                </div>
            `;
        }

        const bubblesView = document.getElementById('bubbles-view');
        const bubbles = [];

        function createBubbles() {
            bubblesView.querySelectorAll('.bubble').forEach(el => el.remove());
            bubbles.length = 0;
            PLATFORMS.forEach(data => bubbles.push(new Bubble(data, bubblesView)));
        }

        function animate() {
            const w = bubblesView.clientWidth;
            const h = bubblesView.clientHeight;
            bubbles.forEach(b => b.update(1, w, h));
            requestAnimationFrame(animate);
        }

        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                document.documentElement.setAttribute('data-view', view);
                localStorage.setItem('werth69-view', view);
                viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view));
                if (view === 'bubbles') {
                    requestAnimationFrame(() => createBubbles());
                }
                if (view === 'crypto') {
                    renderCryptoView();
                }
            });
        });

        const initialView = document.documentElement.getAttribute('data-view') || 'bubbles';
        viewBtns.forEach(b => b.classList.toggle('active', b.dataset.view === initialView));

        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('werth69-theme', next);
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const w = bubblesView.clientWidth, h = bubblesView.clientHeight;
                bubbles.forEach(b => {
                    const r = b.size / 2;
                    if (b.x - r < 0) b.x = r;
                    if (b.x + r > w) b.x = w - r;
                    if (b.y - r < 0) b.y = r;
                    if (b.y + r > h) b.y = h - r;
                });
            }, 150);
        });

        requestAnimationFrame(() => {
            createBubbles();
            animate();
            renderCards();
            if (initialView === 'crypto') {
                renderCryptoView();
            }
        });
    </script>
